<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#74b9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dante-Colors" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="capybara.jpg" />
  <title>Dante-Colors</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
      font-family: 'Comic Sans MS', 'Bubblegum Sans', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Capa de fondo con capibara suave abajo sin tapar con el Good Job */
    .bg-capybara {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      opacity: 0.24;
    }

    .bg-capybara img {
      width: min(350px, 80vw);
      height: auto;
      max-height: 190px;
      object-fit: cover;
      border-radius: 28px;
      filter: saturate(0.95);
      -webkit-mask-image: radial-gradient(ellipse 78% 72% at 50% 50%, #000 52%, transparent 100%);
      mask-image: radial-gradient(ellipse 78% 72% at 50% 50%, #000 52%, transparent 100%);
    }

    .bg-capybara-fallback {
      font-size: clamp(5.5rem, 20vw, 8.5rem);
      line-height: 1;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 22px;
      position: relative;
      z-index: 1;
    }

    /* Botón discreto de cuidado (requiere mantener presionado) */
    .care-trigger {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.14);
      color: #2d3436;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .care-trigger.holding {
      background: #ffeaa7;
      color: #2d3436;
      border-color: #fdcb6e;
    }

    /* Encabezado alegre + Good Job arriba del recuadro */
    .top-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-top: 8px;
      min-height: 132px;
    }

    h1 {
      font-size: clamp(1.75rem, 5.5vw, 2.55rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px #0984e3, 6px 6px 0px rgba(0, 0, 0, 0.18);
      text-align: center;
      line-height: 1.15;
    }

    .dino-mascot {
      font-size: clamp(2.4rem, 7vw, 3.3rem);
      line-height: 1;
      animation: flotarDino 2.2s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.18));
      transition: transform 0.25s ease;
    }

    @keyframes flotarDino {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .praise-text {
      font-size: clamp(1.35rem, 5vw, 1.95rem);
      font-weight: 800;
      color: #ffeaa7;
      background: rgba(9, 132, 227, 0.92);
      border: 3px solid #ffffff;
      text-shadow: 2px 2px 0px #d63031;
      padding: 6px 20px;
      border-radius: 22px;
      opacity: 0;
      transform: translateY(-6px) scale(0.9);
      transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .praise-text.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Recuadro principal gigante con estética alegre */
    .stage {
      width: min(330px, 82vw);
      height: min(330px, 44vh);
      min-height: 240px;
      background-color: #ff7675;
      border-radius: 38px;
      border: 8px solid #ffffff;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.35s ease;
      position: relative;
      overflow: hidden;
      margin: 6px 0;
    }

    .stage:active {
      transform: scale(0.93);
    }

    .visual-frame {
      width: 100%;
      max-width: 215px;
      height: 165px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    .visual-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .visual-frame .fallback-emoji {
      font-size: 4.8rem;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
    }

    .word-label {
      font-size: clamp(1.9rem, 6.8vw, 2.65rem);
      font-weight: 800;
      color: #ffffff;
      line-height: 1.08;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.35);
    }

    .sub-label {
      margin-top: 4px;
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* Pastilla inferior amigable */
    .bottom-bar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .instruction-pill {
      font-size: clamp(0.95rem, 3.6vw, 1.12rem);
      font-weight: 700;
      color: #2d3436;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    /* Panel de cuidado (oculto por defecto) */
    .care-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1e293b;
    }

    .care-modal.open {
      display: flex;
    }

    .care-card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }

    .care-card h2 {
      font-size: 1.2rem;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .care-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: #334155;
    }

    .care-card select,
    .care-card input[type="range"] {
      accent-color: #0984e3;
    }

    .care-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 14px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #0984e3;
      color: #ffffff;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <!-- Fondo de capibara: capybara.jpg en la raíz -->
  <div id="bgCapybara" class="bg-capybara" aria-hidden="true">
    <span id="bgCapybaraFallback" class="bg-capybara-fallback">🦫</span>
    <img id="bgCapybaraImg" src="" alt="" style="display: none;" />
  </div>

  <div class="app">
    <button id="careTrigger" class="care-trigger" type="button" title="Mantén presionado para abrir ajustes">
      Ajustes (mantén)
    </button>

    <div class="top-header">
      <h1>🎨 Let's Play with Colors! 🎨</h1>
      <div id="dinoMascot" class="dino-mascot" aria-hidden="true">🦖</div>
      <div id="praiseText" class="praise-text">Good Job, Dante! 🌟</div>
    </div>

    <div id="stage" class="stage" role="button" tabindex="0" aria-label="Tarjeta interactiva">
      <div id="visualFrame" class="visual-frame">
        <span id="fallbackEmoji" class="fallback-emoji">🎨</span>
        <img id="itemImage" src="" alt="" style="display: none;" />
      </div>
      <div id="wordLabel" class="word-label">Touch me!</div>
      <div id="subLabel" class="sub-label">Dante</div>
    </div>

    <div class="bottom-bar">
      <div class="instruction-pill">¡Toca el cuadro para cambiar de color!</div>
    </div>
  </div>

  <!-- Panel discreto de ajustes para adultos -->
  <div id="careModal" class="care-modal" aria-hidden="true">
    <div class="care-card">
      <h2>Ajustes de Dante-Colors</h2>

      <div class="care-row">
        <label for="orderMode">Orden de tarjetas</label>
        <select id="orderMode">
          <option value="sequential">En orden</option>
          <option value="random">Aleatorio</option>
        </select>
      </div>

      <div class="care-row">
        <label for="praiseDelay">Delay Good Job: <strong id="delayValue">0.9s</strong></label>
        <input id="praiseDelay" type="range" min="300" max="2500" step="100" value="900" />
      </div>

      <div class="care-actions">
        <button id="testPraiseBtn" class="btn btn-secondary" type="button">Probar festejo</button>
        <button id="closeCareBtn" class="btn btn-primary" type="button">Listo</button>
      </div>
    </div>
  </div>

  <script>
    const CAPYBARA_BG_IMAGE = 'capybara.jpg';

    const ITEMS = [
      {
        id: 'red',
        word: 'Red',
        hint: 'Rojo',
        color: '#ff7675',
        emoji: '🔴',
        image: 'red.jpg',
        audio: 'red.mp3'
      },
      {
        id: 'blue',
        word: 'Blue',
        hint: 'Azul',
        color: '#74b9ff',
        emoji: '🔵',
        image: 'blue.jpg',
        audio: 'blue.mp3'
      },
      {
        id: 'green',
        word: 'Green',
        hint: 'Verde',
        color: '#55efc4',
        emoji: '🟢',
        image: 'green.jpg',
        audio: 'green.mp3'
      },
      {
        id: 'yellow',
        word: 'Yellow',
        hint: 'Amarillo',
        color: '#ffeaa7',
        emoji: '🟡',
        image: 'yellow.jpg',
        audio: 'yellow.mp3'
      },
      {
        id: 'purple',
        word: 'Purple',
        hint: 'Morado',
        color: '#a29bfe',
        emoji: '🟣',
        image: 'purple.jpg',
        audio: 'purple.mp3'
      },
      {
        id: 'orange',
        word: 'Orange',
        hint: 'Naranja',
        color: '#fab1a0',
        emoji: '🟠',
        image: 'orange.jpg',
        audio: 'orange.mp3'
      },
      {
        id: 'pink',
        word: 'Pink',
        hint: 'Rosita',
        color: '#fd79a8',
        emoji: '🩷',
        image: 'pink.jpg',
        audio: 'pink.mp3'
      },
      {
        id: 'turquoise',
        word: 'Turquoise',
        hint: 'Turquesa',
        color: '#81ecec',
        emoji: '🩵',
        image: 'turquoise.jpg',
        audio: 'turquoise.mp3'
      }
    ];

    const GOOD_JOB_AUDIO = 'goodjob.mp3';

    let currentIndex = -1;
    let praiseTimer = null;
    let currentAudio = null;
    let audioCtx = null;

    const bgCapybaraImg = document.getElementById('bgCapybaraImg');
    const bgCapybaraFallback = document.getElementById('bgCapybaraFallback');

    const dinoMascot = document.getElementById('dinoMascot');
    const praiseText = document.getElementById('praiseText');
    const stage = document.getElementById('stage');
    const visualFrame = document.getElementById('visualFrame');
    const itemImage = document.getElementById('itemImage');
    const fallbackEmoji = document.getElementById('fallbackEmoji');
    const wordLabel = document.getElementById('wordLabel');
    const subLabel = document.getElementById('subLabel');

    const careTrigger = document.getElementById('careTrigger');
    const careModal = document.getElementById('careModal');
    const orderModeSelect = document.getElementById('orderMode');
    const praiseDelayInput = document.getElementById('praiseDelay');
    const delayValueLabel = document.getElementById('delayValue');
    const testPraiseBtn = document.getElementById('testPraiseBtn');
    const closeCareBtn = document.getElementById('closeCareBtn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    if (CAPYBARA_BG_IMAGE) {
      const capyProbe = new Image();
      capyProbe.onload = () => {
        bgCapybaraImg.src = CAPYBARA_BG_IMAGE;
        bgCapybaraImg.style.display = 'block';
        bgCapybaraFallback.style.display = 'none';
      };
      capyProbe.onerror = () => {
        bgCapybaraImg.style.display = 'none';
        bgCapybaraFallback.style.display = 'block';
      };
      capyProbe.src = CAPYBARA_BG_IMAGE;
    }

    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1 && !e.target.closest('.care-modal')) {
        e.preventDefault();
      }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300 && !e.target.closest('.care-modal')) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function playSoftTone(freq, duration = 0.18, type = 'sine', delay = 0) {
      ensureAudioContext();
      if (!audioCtx) return;

      const startTime = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(0.12, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function playPopSound() {
      playSoftTone(440, 0.14, 'sine', 0);
    }

    function playGentleChime() {
      playSoftTone(523.25, 0.2, 'triangle', 0);
      playSoftTone(659.25, 0.22, 'triangle', 0.15);
      playSoftTone(783.99, 0.35, 'triangle', 0.3);
    }

    function playAudioOrFallback(src, fallbackFn, onEndedCallback) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio.onended = null;
        currentAudio.onerror = null;
      }

      if (!src) {
        if (fallbackFn) fallbackFn();
        if (onEndedCallback) setTimeout(onEndedCallback, 350);
        return;
      }

      const audio = new Audio(src);
      currentAudio = audio;

      let handledFallback = false;
      const triggerFallback = () => {
        if (handledFallback) return;
        handledFallback = true;
        if (fallbackFn) fallbackFn();
        if (onEndedCallback) setTimeout(onEndedCallback, 350);
      };

      audio.onerror = triggerFallback;
      audio.onended = () => {
        if (onEndedCallback) onEndedCallback();
      };

      audio.play().catch(triggerFallback);
    }

    function pickNextIndex() {
      if (ITEMS.length === 1) return 0;

      if (orderModeSelect.value === 'random') {
        let next = Math.floor(Math.random() * ITEMS.length);
        if (next === currentIndex) {
          next = (next + 1) % ITEMS.length;
        }
        return next;
      }

      return (currentIndex + 1) % ITEMS.length;
    }

    function renderItem(item) {
      wordLabel.textContent = item.word;
      subLabel.textContent = item.hint;
      stage.style.backgroundColor = item.color;

      fallbackEmoji.textContent = item.emoji;
      fallbackEmoji.style.display = 'block';
      itemImage.style.display = 'none';

      if (item.image) {
        const probe = new Image();
        probe.onload = () => {
          itemImage.src = item.image;
          itemImage.alt = item.word;
          itemImage.style.display = 'block';
          fallbackEmoji.style.display = 'none';
        };
        probe.onerror = () => {
          itemImage.style.display = 'none';
          fallbackEmoji.style.display = 'block';
        };
        probe.src = item.image;
      }
    }

    function showGoodJob() {
      praiseText.classList.remove('visible');
      void praiseText.offsetWidth;
      praiseText.classList.add('visible');

      dinoMascot.style.transform = 'scale(1.16)';
      setTimeout(() => {
        dinoMascot.style.transform = '';
      }, 320);

      playAudioOrFallback(GOOD_JOB_AUDIO, playGentleChime);
    }

    function handleCardTap() {
      if (careModal.classList.contains('open')) return;

      clearTimeout(praiseTimer);
      praiseText.classList.remove('visible');

      currentIndex = pickNextIndex();
      const item = ITEMS[currentIndex];
      renderItem(item);

      playPopSound();

      const delayMs = Number(praiseDelayInput.value) || 900;

      playAudioOrFallback(
        item.audio,
        () => playSoftTone(587.33, 0.16, 'triangle', 0.05),
        () => {
          praiseTimer = setTimeout(showGoodJob, delayMs);
        }
      );
    }

    stage.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleCardTap();
    });

    stage.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleCardTap();
      }
    });

    let holdTimer = null;
    const HOLD_MS = 1200;

    function startHold(e) {
      e.stopPropagation();
      careTrigger.classList.add('holding');
      holdTimer = setTimeout(() => {
        careTrigger.classList.remove('holding');
        careModal.classList.add('open');
        careModal.setAttribute('aria-hidden', 'false');
      }, HOLD_MS);
    }

    function cancelHold(e) {
      if (e) e.stopPropagation();
      clearTimeout(holdTimer);
      careTrigger.classList.remove('holding');
    }

    careTrigger.addEventListener('pointerdown', startHold);
    careTrigger.addEventListener('pointerup', cancelHold);
    careTrigger.addEventListener('pointerleave', cancelHold);
    careTrigger.addEventListener('pointercancel', cancelHold);

    praiseDelayInput.addEventListener('input', () => {
      const sec = (Number(praiseDelayInput.value) / 1000).toFixed(1);
      delayValueLabel.textContent = `${sec}s`;
    });

    testPraiseBtn.addEventListener('click', () => {
      careModal.classList.remove('open');
      careModal.setAttribute('aria-hidden', 'true');
      showGoodJob();
    });

    closeCareBtn.addEventListener('click', () => {
      careModal.classList.remove('open');
      careModal.setAttribute('aria-hidden', 'true');
    });
  </script>
</body>
</html>
